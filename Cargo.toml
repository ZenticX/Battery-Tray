[package]
name = "Battery-Tray"
version = "1.0.0"
edition = "2026"
description = "Battery Tray — system tray battery indicator for Razer Viper V3 Pro and Weikav Stars21-S"
license = "MIT"
repository = "https://github.com/damianyoko/viper-tray"

[[bin]]
name = "Battery-Tray"
path = "src/main.rs"

[dependencies]
tray-icon = { version = "0.19", default-features = false }
winrt-notification = "0.5"
muda = { version = "0.15", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
eframe = { version = "0.27", features = ["wgpu"] }
winit = "0.30"

[dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Properties",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"


